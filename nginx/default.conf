server {
    listen 80 default_server;
    listen 443 ssl default_server;

    server_name gegeda.xyz;

    # 🔗 证书路径保持不变
    ssl_certificate     /etc/nginx/ssl/gegeda.crt;
    ssl_certificate_key /etc/nginx/ssl/gegeda.key;

    # 🌟 关键：关闭全局的版本号/名称显示
    server_tokens off;

    # 核心：直接返回一个没有底部 nginx 尾巴的干净 404 HTML
    location / {
        chunked_transfer_encoding off;
        default_type text/html;
        return 404 "<html>\r\n<head><title>404 Not Found</title></head>\r\n<body>\r\n<center><h1>404 Not Found</h1></center>\r\n</body>\r\n</html>\r\n";
    }
}