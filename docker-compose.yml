services:
  3xui:
    image: ghcr.io/small-star-666/3x-ui-plus:latest
    container_name: 3xui_plus_app
    volumes:
      - $PWD/db/:/etc/x-ui/
      - $PWD/cert/:/root/cert/
    environment:
      XRAY_VMESS_AEAD_FORCED: "false"
      # 如果你在宿主机上配置网络，建议关闭容器内的 fail2ban，改由宿主机控制，减少容器内多进程的 CPU 争抢
      XUI_ENABLE_FAIL2BAN: "false"
    tty: true
    network_mode: host
    # 推荐改为 always，确保机器因任何原因重启（如 AWS 维护、内存溢出后系统放回）容器都能立刻自愈
    restart: always